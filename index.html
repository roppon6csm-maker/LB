<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Smart Dispatcher</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --primary-color: #2c3e50;
            --accent-color: #18bc9c;
            --text-color: #333;
            --card-bg: #ffffff;
            --border-color: #e0e0e0;
            --active-tab-bg: #18bc9c;
            --active-tab-text: #ffffff;
            --hover-color: #f9f9f9;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --primary-color: #ecf0f1;
            --accent-color: #00bc8c;
            --text-color: #f5f5f5;
            --card-bg: #222222;
            --border-color: #444444;
            --active-tab-bg: #00bc8c;
            --active-tab-text: #ffffff;
            --hover-color: #2b2b2b;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            color: var(--primary-color);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .version-badge {
            background-color: var(--primary-color);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            color: var(--text-color);
            font-size: 14px;
        }

        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-bottom: none;
            border-radius: 4px 4px 0 0;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .tab.active {
            background-color: var(--active-tab-bg);
            color: var(--active-tab-text);
            border-color: var(--active-tab-bg);
        }

        .tab-content {
            display: none;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 0 0 4px 4px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .tab-content.active {
            display: block;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full-width {
            grid-column: span 2;
        }

        .card {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 16px;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 15px;
            border-left: 4px solid var(--accent-color);
            padding-left: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            background-color: var(--card-bg);
            color: var(--text-color);
        }

        textarea.form-control {
            resize: vertical;
            font-family: monospace;
            font-size: 12px;
        }

        .btn {
            background-color: #fff;
            color: #333;
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn:hover {
            background-color: var(--hover-color);
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-danger {
            background-color: #e74c3c;
            color: #fff;
            border-color: #e74c3c;
        }

        .btn-block {
            display: flex;
            width: 100%;
            justify-content: center;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .table-responsive {
            overflow-x: auto;
            max-height: 500px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            text-align: left;
        }

        th {
            background-color: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        tr:nth-child(even) {
            background-color: var(--hover-color);
        }

        tr.selected {
            background-color: rgba(24, 188, 156, 0.2) !important;
        }

        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .action-panel {
            margin-top: 15px;
            padding: 15px;
            background-color: var(--bg-color);
            border-radius: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-ok { background-color: #2ecc71; color: #fff; }
        .status-ng { background-color: #e74c3c; color: #fff; }
        .status-pending { background-color: #f1c40f; color: #333; }

        .template-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Smart Dispatcher</h1>
        <div class="header-controls">
            <span class="version-badge" id="versionBadge">ver.0.2.9</span>
            <button class="theme-toggle" id="themeToggle">🌙 ダークモード</button>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('management-tab')">管理表</div>
        <div class="tab" onclick="switchTab('performers-tab')">出演者</div>
        <div class="tab" onclick="switchTab('contacts-tab')">連絡先マスタ</div>
        <div class="tab" onclick="switchTab('settings-tab')">設定</div>
    </div>

    <div id="management-tab" class="tab-content active">
        <div class="search-container">
            <input type="text" id="masterSearch" class="form-control" placeholder="キーワードで検索（アーティスト、ヨミ、要望など）..." oninput="filterMasterTable()">
            <button class="btn" onclick="clearMasterSearch()">クリア</button>
        </div>
        <div class="table-responsive">
            <table id="masterTable">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>アーティスト名</th>
                        <th>ヨミ</th>
                        <th>Twitter</th>
                        <th>LINE</th>
                        <th>Mail</th>
                        <th>出演回数</th>
                        <th>出演flag</th>
                        <th>要望</th>
                        <th>進捗</th>
                        <th>備考1</th>
                        <th>備考2</th>
                    </tr>
                </thead>
                <tbody id="masterTableBody">
                    </tbody>
            </table>
        </div>
        <div class="action-panel" id="masterActionPanel">
            <strong>選択中: </strong><span id="selectedMasterName">なし</span>
            <button class="btn" id="btnMasterX" onclick="openX()" disabled>𝕏 起動</button>
            <button class="btn" id="btnMasterLine" onclick="openLine()" disabled>LINE 起動</button>
            <button class="btn" id="btnMasterMail" onclick="openMail()" disabled>メール作成</button>
            <button class="btn" onclick="copyRowData('master')">行データコピー</button>
            <button class="btn" onclick="openTemplateModal('master')">文面生成</button>
        </div>
    </div>

    <div id="performers-tab" class="tab-content">
        <div class="search-container">
            <input type="text" id="performerSearch" class="form-control" placeholder="出演者を検索..." oninput="filterPerformerTable()">
            <button class="btn" onclick="clearPerformerSearch()">クリア</button>
        </div>
        <div class="table-responsive">
            <table id="performerTable">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>アーティスト</th>
                        <th>出演回数</th>
                        <th>出演flag</th>
                        <th>ヨミ</th>
                        <th>要望</th>
                        <th>進捗</th>
                    </tr>
                </thead>
                <tbody id="performerTableBody">
                    </tbody>
            </table>
        </div>
        <div class="action-panel" id="performerActionPanel">
            <strong>選択中: </strong><span id="selectedPerformerName">なし</span>
            <button class="btn" id="btnPerformerX" onclick="openX()" disabled>𝕏 起動</button>
            <button class="btn" id="btnPerformerLine" onclick="openLine()" disabled>LINE 起動</button>
            <button class="btn" id="btnPerformerMail" onclick="openMail()" disabled>メール作成</button>
            <button class="btn" onclick="copyRowData('performer')">行データコピー</button>
            <button class="btn" onclick="openTemplateModal('performer')">文面生成</button>
        </div>
    </div>

    <div id="contacts-tab" class="tab-content">
        <div class="search-container">
            <input type="text" id="contactSearch" class="form-control" placeholder="連絡先を検索..." oninput="filterContactTable()">
            <button class="btn" onclick="clearContactSearch()">クリア</button>
        </div>
        <div class="table-responsive">
            <table id="contactTable">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>アーティスト名</th>
                        <th>Twitter</th>
                        <th>LINE</th>
                        <th>Mail</th>
                        <th>ヨミ</th>
                        <th>備考1</th>
                        <th>備考2</th>
                    </tr>
                </thead>
                <tbody id="contactTableBody">
                    </tbody>
            </table>
        </div>
        <div class="action-panel" id="contactActionPanel">
            <strong>選択中: </strong><span id="selectedContactName">なし</span>
            <button class="btn" id="btnContactX" onclick="openX()" disabled>𝕏 起動</button>
            <button class="btn" id="btnContactLine" onclick="openLine()" disabled>LINE 起動</button>
            <button class="btn" id="btnContactMail" onclick="openMail()" disabled>メール作成</button>
            <button class="btn" onclick="copyRowData('contact')">行データコピー</button>
            <button class="btn" onclick="openTemplateModal('contact')">文面生成</button>
        </div>
    </div>

    <div id="settings-tab" class="tab-content">
        <div class="grid-container">
            <div class="full-width">
                <div class="card">
                    <div class="card-title">テンプレート登録管理</div>
                    <div class="form-group">
                        <label for="templateName">テンプレート名</label>
                        <input type="text" id="templateName" class="form-control" placeholder="例: 出演打診メール">
                    </div>
                    <div class="form-group">
                        <label for="templateContent">本文テンプレート</label>
                        <textarea id="templateContent" class="form-control" rows="6" placeholder="利用可能変数: {アーティスト名}, {要望}, {進捗}, {備考1}, {備考2}"></textarea>
                    </div>
                    <button class="btn btn-primary" onclick="saveTemplate()">テンプレート追加/保存</button>
                    
                    <div style="margin-top: 15px;">
                        <strong>登録済みテンプレート一覧</strong>
                        <div id="templateList" style="margin-top: 5px; border: 1px solid var(--border-color); border-radius: 4px; max-height: 150px; overflow-y: auto;">
                            </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">連絡先リスト</div>
                    <div class="form-group">
                        <textarea id="rawContactInput" class="form-control" rows="6" placeholder="【連絡先】No	アーティスト名	Twitter	LINE	Mail... （11列のTSVデータを貼り付けてください）"></textarea>
                    </div>
                    <button class="btn" onclick="exportListData('contact')">リストデータ書き出し</button>
                </div>

                <div class="card">
                    <div class="card-title">出演者リスト</div>
                    <div class="form-group">
                        <textarea id="rawPerformerInput" class="form-control" rows="6" placeholder="【出演者】No	アーティスト	出演回数	出演flag	ヨミ	要望	進捗 （7列のTSVデータを貼り付けてください）"></textarea>
                    </div>
                    <button class="btn" onclick="exportListData('performer')">リストデータ書き出し</button>
                </div>

                <button class="btn btn-primary btn-block" style="padding: 12px;" onclick="saveAllSettings()">データを反映して保存</button>
            </div>
        </div>
    </div>

    <div id="templateModal" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; justify-content: center; align-items: center;">
        <div style="background: var(--card-bg); padding: 20px; border-radius: 6px; width: 80%; max-width: 600px; border: 1px solid var(--border-color);">
            <h3>文面生成・送信</h3>
            <div class="form-group">
                <label for="modalTemplateSelect">テンプレート選択</label>
                <select id="modalTemplateSelect" class="form-control" onchange="generateModalText()"></select>
            </div>
            <div class="form-group">
                <label for="modalOutputText">生成されたテキスト</label>
                <textarea id="modalOutputText" class="form-control" rows="10"></textarea>
            </div>
            <div style="display: flex; justify-content: space-between;">
                <button class="btn btn-primary" onclick="copyModalText()">テキストをコピー</button>
                <button class="btn" onclick="closeTemplateModal()">閉じる</button>
            </div>
        </div>
    </div>

    <script>
        // --- データモデル ---
        let state = {
            master: [],      // 管理表（結合データ）
            performers: [],  // 出演者リスト単体
            contacts: [],    // 連絡先リスト単体
            templates: {},   // テンプレート
            selectedTab: 'management-tab',
            selectedRows: {
                master: null,
                performer: null,
                contact: null
            },
            theme: 'light'
        };

        // --- 初期化 ---
        window.onload = function() {
            loadFromStorage();
            initTheme();
            renderAll();
        };

        function loadFromStorage() {
            const savedTheme = localStorage.getItem('sd_theme');
            if (savedTheme) state.theme = savedTheme;

            const savedTemplates = localStorage.getItem('sd_templates');
            if (savedTemplates) {
                state.templates = JSON.parse(savedTemplates);
            } else {
                state.templates = {
                    "【サンプル】出演打診": "{アーティスト名}様\n\nいつもお世話になっております。\n本日はイベント出演のご相談でご連絡いたしました。\nご要望にありました「{要望}」の件、調整可能です。\nご検討よろしくお願いいたします。"
                };
            }

            // 連絡先マスタ読み込み
            const savedContacts = localStorage.getItem('sd_raw_contacts');
            if (savedContacts) {
                document.getElementById('rawContactInput').value = savedContacts;
                state.contacts = parseTSV(savedContacts, 11);
            }

            // 出演者リスト読み込み
            const savedPerformers = localStorage.getItem('sd_raw_performers');
            if (savedPerformers) {
                document.getElementById('rawPerformerInput').value = savedPerformers;
                state.performers = parseTSV(savedPerformers, 7);
            }

            // 管理表データの結合
            buildMasterData();
        }

        function buildMasterData() {
            state.master = [];
            // 出演者リストをベースに、連絡先マスタをマージ
            state.performers.forEach(p => {
                // 名前で結合を試みる
                const c = state.contacts.find(con => con.col2 === p.col2) || {};
                
                state.master.push({
                    no: p.col1 || '',
                    name: p.col2 || '',
                    yomi: p.col5 || c.col6 || '',
                    twitter: c.col3 || '',
                    line: c.col4 || '',
                    mail: c.col5 || '',
                    count: p.col3 || '',
                    flag: p.col4 || '',
                    request: p.col6 || '',
                    progress: p.col7 || '',
                    note1: c.col7 || '',
                    note2: c.col8 || ''
                });
            });
        }

        function parseTSV(text, expectedCols) {
            if (!text.trim()) return [];
            const lines = text.split('\n');
            return lines.map(line => {
                const cols = line.split('\t');
                const rowObj = {};
                for (let i = 0; i < expectedCols; i++) {
                    rowObj[`col${i+1}`] = cols[i] ? cols[i].trim() : '';
                }
                return rowObj;
            });
        }

        // --- テーマ切り替え ---
        function initTheme() {
            document.documentElement.setAttribute('data-theme', state.theme);
            const btn = document.getElementById('themeToggle');
            if (state.theme === 'dark') {
                btn.innerText = '☀️ ライトモード';
            } else {
                btn.innerText = '🌙 ダークモード';
            }
        }

        document.getElementById('themeToggle').addEventListener('click', () => {
            if (state.theme === 'light') {
                state.theme = 'dark';
            } else {
                state.theme = 'light';
            }
            localStorage.setItem('sd_theme', state.theme);
            initTheme();
        });

        // --- タブ切り替え ---
        function switchTab(tabId) {
            state.selectedTab = tabId;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            const tabIndex = ['management-tab', 'performers-tab', 'contacts-tab', 'settings-tab'].indexOf(tabId);
            if (tabIndex !== -1) {
                document.querySelectorAll('.tab')[tabIndex].classList.add('active');
            }
            document.getElementById(tabId).classList.add('active');
        }

        // --- 描画処理 ---
        function renderAll() {
            renderMasterTable();
            renderPerformerTable();
            renderContactTable();
            renderTemplateList();
        }

        function renderMasterTable(data = state.master) {
            const tbody = document.getElementById('masterTableBody');
            tbody.innerHTML = '';
            data.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.onclick = () => selectRow('master', index, row);
                if (state.selectedRows.master === index) tr.classList.add('selected');

                tr.innerHTML = `
                    <td>${escapeHtml(row.no)}</td>
                    <td>${escapeHtml(row.name)}</td>
                    <td>${escapeHtml(row.yomi)}</td>
                    <td>${escapeHtml(row.twitter)}</td>
                    <td>${escapeHtml(row.line)}</td>
                    <td>${escapeHtml(row.mail)}</td>
                    <td>${escapeHtml(row.count)}</td>
                    <td><span class="status-badge ${row.flag === '◯' || row.flag === '1' ? 'status-ok' : 'status-pending'}">${escapeHtml(row.flag)}</span></td>
                    <td>${escapeHtml(row.request)}</td>
                    <td>${escapeHtml(row.progress)}</td>
                    <td>${escapeHtml(row.note1)}</td>
                    <td>${escapeHtml(row.note2)}</td>
                `;
                tbody.appendChild(tr);
            });
            updateActionPanel('master');
        }

        function renderPerformerTable(data = state.performers) {
            const tbody = document.getElementById('performerTableBody');
            tbody.innerHTML = '';
            data.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.onclick = () => selectRow('performer', index, row);
                if (state.selectedRows.performer === index) tr.classList.add('selected');

                tr.innerHTML = `
                    <td>${escapeHtml(row.col1)}</td>
                    <td>${escapeHtml(row.col2)}</td>
                    <td>${escapeHtml(row.col3)}</td>
                    <td><span class="status-badge ${row.col4 === '◯' || row.col4 === '1' ? 'status-ok' : 'status-pending'}">${escapeHtml(row.col4)}</span></td>
                    <td>${escapeHtml(row.col5)}</td>
                    <td>${escapeHtml(row.col6)}</td>
                    <td>${escapeHtml(row.col7)}</td>
                `;
                tbody.appendChild(tr);
            });
            updateActionPanel('performer');
        }

        function renderContactTable(data = state.contacts) {
            const tbody = document.getElementById('contactTableBody');
            tbody.innerHTML = '';
            data.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.onclick = () => selectRow('contact', index, row);
                if (state.selectedRows.contact === index) tr.classList.add('selected');

                tr.innerHTML = `
                    <td>${escapeHtml(row.col1)}</td>
                    <td>${escapeHtml(row.col2)}</td>
                    <td>${escapeHtml(row.col3)}</td>
                    <td>${escapeHtml(row.col4)}</td>
                    <td>${escapeHtml(row.col5)}</td>
                    <td>${escapeHtml(row.col6)}</td>
                    <td>${escapeHtml(row.col7)}</td>
                    <td>${escapeHtml(row.col8)}</td>
                `;
                tbody.appendChild(tr);
            });
            updateActionPanel('contact');
        }

        function renderTemplateList() {
            const container = document.getElementById('templateList');
            container.innerHTML = '';
            Object.keys(state.templates).forEach(name => {
                const div = document.createElement('div');
                div.className = 'template-item';
                div.innerHTML = `
                    <span>${escapeHtml(name)}</span>
                    <div>
                        <button class="btn" style="padding:2px 6px; font-size:12px;" onclick="loadTemplateToForm('${escapeHtml(name)}')">編集</button>
                        <button class="btn btn-danger" style="padding:2px 6px; font-size:12px;" onclick="deleteTemplate('${escapeHtml(name)}')">削除</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // --- 行選択とアクションパネル制御 ---
        function selectRow(type, index, rowData) {
            if (state.selectedRows[type] === index) {
                state.selectedRows[type] = null;
            } else {
                state.selectedRows[type] = index;
            }

            if (type === 'master') renderMasterTable();
            if (type === 'performer') renderPerformerTable();
            if (type === 'contact') renderContactTable();
        }

        function updateActionPanel(type) {
            const index = state.selectedRows[type];
            const nameSpan = document.getElementById(`selected${type.charAt(0).toUpperCase() + type.slice(1)}Name`);
            const btnX = document.getElementById(`btn${type.charAt(0).toUpperCase() + type.slice(1)}X`);
            const btnLine = document.getElementById(`btn${type.charAt(0).toUpperCase() + type.slice(1)}Line`);
            const btnMail = document.getElementById(`btn${type.charAt(0).toUpperCase() + type.slice(1)}Mail`);

            if (index === null || index === undefined) {
                if (nameSpan) nameSpan.innerText = 'なし';
                if (btnX) btnX.disabled = true;
                if (btnLine) btnLine.disabled = true;
                if (btnMail) btnMail.disabled = true;
                return;
            }

            let name = '', twitter = '', line = '', mail = '';

            if (type === 'master') {
                const data = state.master[index];
                name = data.name; twitter = data.twitter; line = data.line; mail = data.mail;
                if (nameSpan) nameSpan.innerText = name;
                if (btnX) btnX.disabled = !twitter;
                if (btnLine) btnLine.disabled = !line;
                if (btnMail) btnMail.disabled = !mail;
            } else if (type === 'performer') {
                const data = state.performers[index];
                name = data.col2;
                if (nameSpan) nameSpan.innerText = name;
                // 出演者データ参照時は連動ボタンを常に非活性化（Bパターン）
                if (btnX) btnX.disabled = true;
                if (btnLine) btnLine.disabled = true;
                if (btnMail) btnMail.disabled = true;
            } else if (type === 'contact') {
                const data = state.contacts[index];
                name = data.col2; twitter = data.col3; line = data.col4; mail = data.col5;
                if (nameSpan) nameSpan.innerText = name;
                if (btnX) btnX.disabled = !twitter;
                if (btnLine) btnLine.disabled = !line;
                if (btnMail) btnMail.disabled = !mail;
            }
        }

        // --- 外部サービス連携ロジック ---
        function openX() {
            const type = state.selectedTab.replace('-tab', '');
            const index = state.selectedRows[type === 'management' ? 'master' : type === 'contacts' ? 'contact' : 'performer'];
            let username = '';
            if (type === 'management') username = state.master[index].twitter;
            if (type === 'contacts') username = state.contacts[index].col3;
            
            if (username) {
                const cleanName = username.replace('@', '');
                window.open(`https://x.com/${cleanName}`, '_blank');
            }
        }

        function openLine() {
            const type = state.selectedTab.replace('-tab', '');
            const index = state.selectedRows[type === 'management' ? 'master' : type === 'contacts' ? 'contact' : 'performer'];
            let lineId = '';
            if (type === 'management') lineId = state.master[index].line;
            if (type === 'contacts') lineId = state.contacts[index].col4;

            if (lineId) {
                window.open(`https://line.me/R/ti/p/~${lineId}`, '_blank');
            }
        }

        function openMail() {
            const type = state.selectedTab.replace('-tab', '');
            const index = state.selectedRows[type === 'management' ? 'master' : type === 'contacts' ? 'contact' : 'performer'];
            let mailAddr = '';
            if (type === 'management') mailAddr = state.master[index].mail;
            if (type === 'contacts') mailAddr = state.contacts[index].col5;

            if (mailAddr) {
                window.location.href = `mailto:${mailAddr}`;
            }
        }

        function copyRowData(type) {
            const index = state.selectedRows[type];
            if (index === null) return;
            let text = '';
            if (type === 'master') {
                const r = state.master[index];
                text = `${r.no}\t${r.name}\t${r.yomi}\t${r.twitter}\t${r.line}\t${r.mail}\t${r.count}\t${r.flag}\t${r.request}\t${r.progress}\t${r.note1}\t${r.note2}`;
            } else if (type === 'performer') {
                const r = state.performers[index];
                text = `${r.col1}\t${r.col2}\t${r.col3}\t${r.col4}\t${r.col5}\t${r.col6}\t${r.col7}`;
            } else if (type === 'contact') {
                const r = state.contacts[index];
                text = `${r.col1}\t${r.col2}\t${r.col3}\t${r.col4}\t${r.col5}\t${r.col6}\t${r.col7}\t${r.col8}`;
            }
            navigator.clipboard.writeText(text);
            alert('クリップボードに行データをコピーしました。');
        }

        // --- 検索フィルタ機能 ---
        function filterMasterTable() {
            const q = document.getElementById('masterSearch').value.toLowerCase();
            const filtered = state.master.filter(r => 
                r.name.toLowerCase().includes(q) || 
                r.yomi.toLowerCase().includes(q) || 
                r.request.toLowerCase().includes(q) || 
                r.progress.toLowerCase().includes(q) ||
                r.note1.toLowerCase().includes(q) ||
                r.note2.toLowerCase().includes(q)
            );
            renderMasterTable(filtered);
        }
        function clearMasterSearch() { document.getElementById('masterSearch').value = ''; renderMasterTable(); }

        function filterPerformerTable() {
            const q = document.getElementById('performerSearch').value.toLowerCase();
            const filtered = state.performers.filter(r => 
                r.col2.toLowerCase().includes(q) || r.col5.toLowerCase().includes(q) || r.col6.toLowerCase().includes(q)
            );
            renderPerformerTable(filtered);
        }
        function clearPerformerSearch() { document.getElementById('performerSearch').value = ''; renderPerformerTable(); }

        function filterContactTable() {
            const q = document.getElementById('contactSearch').value.toLowerCase();
            const filtered = state.contacts.filter(r => 
                r.col2.toLowerCase().includes(q) || r.col6.toLowerCase().includes(q)
            );
            renderContactTable(filtered);
        }
        function clearContactSearch() { document.getElementById('contactSearch').value = ''; renderContactTable(); }


        // --- 設定・マスタ管理ロジック ---
        function saveTemplate() {
            const name = document.getElementById('templateName').value.trim();
            const content = document.getElementById('templateContent').value;
            if (!name) return alert('テンプレート名を入力してください。');
            state.templates[name] = content;
            localStorage.setItem('sd_templates', JSON.stringify(state.templates));
            renderTemplateList();
            document.getElementById('templateName').value = '';
            document.getElementById('templateContent').value = '';
            alert('テンプレートを保存しました。');
        }

        function loadTemplateToForm(name) {
            document.getElementById('templateName').value = name;
            document.getElementById('templateContent').value = state.templates[name] || '';
        }

        function deleteTemplate(name) {
            if (confirm(`テンプレート「${name}」を削除しますか？`)) {
                delete state.templates[name];
                localStorage.setItem('sd_templates', JSON.stringify(state.templates));
                renderTemplateList();
            }
        }

        function exportListData(type) {
            let text = '';
            if (type === 'contact') {
                text = document.getElementById('rawContactInput').value;
            } else if (type === 'performer') {
                // 出演者タブの表示そのままの7列構成のTSV形式を出力
                text = state.performers.map(r => 
                    `${r.col1}\t${r.col2}\t${r.col3}\t${r.col4}\t${r.col5}\t${r.col6}\t${r.col7}`
                ).join('\n');
            }
            navigator.clipboard.writeText(text);
            alert(`${type === 'contact' ? '連絡先' : '出演者'}リストのTSVデータをクリップボードに書き出しました。`);
        }

        function saveAllSettings() {
            const rawContact = document.getElementById('rawContactInput').value;
            const rawPerformer = document.getElementById('rawPerformerInput').value;

            // 各データをローカルストレージへ完全に置き換えて（上書き）保存
            localStorage.setItem('sd_raw_contacts', rawContact);
            localStorage.setItem('sd_raw_performers', rawPerformer);

            state.contacts = parseTSV(rawContact, 11);
            state.performers = parseTSV(rawPerformer, 7);

            buildMasterData();
            renderAll();
            
            // 選択状態のクリア
            state.selectedRows = { master: null, performer: null, contact: null };
            updateActionPanel('master');
            updateActionPanel('performer');
            updateActionPanel('contact');

            alert('すべての設定データを反映して保存しました。');
        }

        // --- 文面生成モーダル制御 ---
        let currentModalTarget = { type: null, index: null };

        function openTemplateModal(type) {
            const index = state.selectedRows[type === 'master' ? 'master' : type === 'contact' ? 'contact' : 'performer'];
            if (index === null || index === undefined) return alert('行を選択してください。');

            currentModalTarget = { type, index };
            
            const select = document.getElementById('modalTemplateSelect');
            select.innerHTML = '<option value="">-- テンプレートを選択してください --</option>';
            Object.keys(state.templates).forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.innerText = name;
                select.appendChild(opt);
            });

            document.getElementById('modalOutputText').value = '';
            document.getElementById('templateModal').style.display = 'flex';
        }

        function closeTemplateModal() {
            document.getElementById('templateModal').style.display = 'none';
        }

        function generateModalText() {
            const select = document.getElementById('modalTemplateSelect');
            const templateName = select.value;
            if (!templateName) {
                document.getElementById('modalOutputText').value = '';
                return;
            }

            let template = state.templates[templateName] || '';
            const { type, index } = currentModalTarget;

            let replaceMap = {};
            if (type === 'master') {
                const r = state.master[index];
                replaceMap = { '{アーティスト名}': r.name, '{要望}': r.request, '{進捗}': r.progress, '{備考1}': r.note1, '{備考2}': r.note2 };
            } else if (type === 'performer') {
                const r = state.performers[index];
                replaceMap = { '{アーティスト名}': r.col2, '{要望}': r.col6, '{進捗}': r.col7, '{備考1}': '', '{備考2}': '' };
            } else if (type === 'contact') {
                const r = state.contacts[index];
                replaceMap = { '{アーティスト名}': r.col2, '{要望}': '', '{進捗}': '', '{備考1}': r.col7, '{備考2}': r.col8 };
            }

            Object.keys(replaceMap).forEach(key => {
                template = template.replaceAll(key, replaceMap[key] || '');
            });

            document.getElementById('modalOutputText').value = template;
        }

        function copyModalText() {
            const text = document.getElementById('modalOutputText').value;
            navigator.clipboard.writeText(text);
            alert('生成されたテキストをコピーしました。');
        }

        // ユーティリティ
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
    </script>
</body>
</html>
